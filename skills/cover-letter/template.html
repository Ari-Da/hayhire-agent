<!doctype html>
<html><head><meta charset="utf-8">
<title>Cover Letter</title>
<link href="https://fonts.googleapis.com/css2?family=Carlito:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  @page { size: A4; margin: 0; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { width: 210mm; height: 297mm; font-family: Carlito, Calibri, "Helvetica Neue", Arial, sans-serif; color: #333; position: relative; overflow: hidden; }
  .name { position: absolute; left: 7mm; top: 6.5mm; border-left: 1.6mm solid #333; padding-left: 3mm; height: 14mm; line-height: 14mm; font-size: 23pt; font-weight: 700; color: #333; }
  .rule { position: absolute; left: 0; right: 0; border-top: 0.8mm solid #333; }
  .rule.top { top: 22.8mm; } .rule.bottom { top: 30.8mm; }
  .contact { position: absolute; top: 23.6mm; left: 0; right: 0; height: 7mm; display: flex; justify-content: center; align-items: center; gap: 7mm; font-size: 9.6pt; color: #333; }
  .contact span { display: inline-flex; align-items: center; gap: 2mm; }
  .contact svg { width: 4mm; height: 4mm; fill: #333; }
  .section { position: absolute; left: 7mm; top: 33.5mm; border-left: 1.6mm solid #333; padding-left: 3mm; height: 8.5mm; line-height: 8.5mm; font-size: 12pt; font-weight: 700; }
  .letter { position: absolute; left: 10.7mm; right: 7mm; top: 43mm; font-size: 9.6pt; line-height: 1.5; text-align: justify; }
  .date { text-align: right; margin-bottom: 11mm; }
  .re { margin-bottom: 5.5mm; text-align: left; }
  p { margin: 0 0 5.2mm 0; }
  .left { text-align: left; }
</style></head>
<body>
  <div class="name">{{NAME}}</div>
  <div class="rule top"></div>
  <div class="contact">
    <span><svg viewBox="0 0 24 24"><path d="M2 5h20v2.2l-10 6.3L2 7.2V5zm0 4.6l10 6.3 10-6.3V19H2V9.6z"/></svg>{{EMAIL}}</span>
    <span><svg viewBox="0 0 24 24"><path d="M6.6 10.8a15 15 0 006.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 013 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.300.2 2.500.6 3.600.1.300 0 .700-.2 1l-2.300 2.200z"/></svg>{{PHONE}}</span>
    <span><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 100 20 10 10 0 000-20zm-1 17.9A8 8 0 014 12c0-.6.1-1.200.2-1.800L9 15v1c0 1.100.9 2 2 2v1.900zm6.900-2.500c-.3-.8-1-1.400-1.900-1.400h-1v-3c0-.6-.4-1-1-1H8v-2h2c.6 0 1-.4 1-1V7h2c1.100 0 2-.9 2-2v-.4a8 8 0 012.900 12.800z"/></svg>{{WEBSITE}}</span>
    <span><svg viewBox="0 0 24 24"><path d="M4.500 8.500h3.600V20H4.500V8.500zM6.300 3a2.100 2.100 0 110 4.200 2.100 2.100 0 010-4.200zM10.300 8.500h3.400v1.600c.5-.9 1.700-1.900 3.500-1.900 3.700 0 4.400 2.400 4.400 5.600V20h-3.600v-5.400c0-1.300 0-3-1.800-3s-2.100 1.400-2.100 2.900V20h-3.600V8.500z"/></svg>{{LINKEDIN}}</span>
    <span><svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 00-7 7c0 5.200 7 13 7 13s7-7.800 7-13a7 7 0 00-7-7zm0 9.500A2.500 2.500 0 1112 6.500a2.500 2.500 0 010 5z"/></svg>{{LOCATION}}</span>
  </div>
  <div class="rule bottom"></div>
  <div class="section">Cover Letter</div>
  <div class="letter">
    <div class="date">{{DATE}}</div>
    <div class="re">RE: <b>{{RE_TITLE}}</b></div>
    <p class="left">Dear Hiring Team,</p>
    <p>{{INTRO}}</p>
    <p>{{EXPERIENCE}}</p>
    <p>{{PARA3}}</p>
    <p class="left">{{CLOSING}}</p>
    <p class="left">Sincerely,</p>
    <p class="left">{{NAME}}</p>
  </div>
</body></html>
